# Builds BreakBoss on Codemagic's Macs: the same steps as .github/workflows/build.yml and upload.yml,
# for when GitHub Actions can't run. Runs only when started: Codemagic › BreakBoss › Start new build,
# then pick a branch and one of these workflows:
#   build       compile the Playgrounds package and the app + AUv3, then run the self-test on an iPad simulator
#   testflight  build, sign, upload to App Store Connect, give it to the internal testers, send it to the
#               external group, and keep the .swiftpm zip
#
# Setup in Codemagic (once):
#   Add application › GitHub › tabdanger/BreakBoss › "codemagic.yaml" as the configuration.
#   Personal Account › Settings › Integrations › Developer Portal › Manage keys › Add key: name it
#   exactly  BreakBoss  and upload an App Store Connect API key (.p8, Admin role) with its Issuer ID
#   and Key ID. The same team key Red Clip uses works here too.
#   Nothing else is needed: the Team ID is read from the bundle ID, and the build number is one more
#   than the latest build in App Store Connect (never below 121). To force a build number, add an
#   environment variable BREAKBOSS_BUILD (digits) in the app settings.
definitions:
  scripts:
    - &github_env
      name: Use the GitHub build scripts here
      script: |
        # .github/scripts read GITHUB_ENV / GITHUB_WORKSPACE; Codemagic's CM_ENV does the same job.
        mkdir -p "$HOME/breakboss-tmp"
        {
          echo "GITHUB_ENV=$CM_ENV"
          echo "GITHUB_WORKSPACE=$CM_BUILD_DIR"
          echo "GITHUB_RUN_ID=cm-$CM_BUILD_ID"
          echo "RUNNER_TEMP=$HOME/breakboss-tmp"
          echo "SIGNING=$HOME/breakboss-tmp/signing"
        } >> "$CM_ENV"
        echo "::notice title=Xcode::$(xcodebuild -version | tr '\n' ' ')"
        case "$(xcodebuild -version | head -1)" in
          "Xcode 2"[6-9]*) ;;
          *) echo "::error title=Xcode::Apple only accepts apps built with Xcode 26 or later."; exit 1 ;;
        esac
    - &xcodegen
      name: Make the Xcode project (app + AUv3 plug-in) with XcodeGen
      script: |
        command -v xcodegen > /dev/null || brew install xcodegen > "$RUNNER_TEMP/brew.log" 2>&1 || { tail -20 "$RUNNER_TEMP/brew.log"; exit 1; }
        BREAKBOSS_BUILD="${BUILD:-$BREAKBOSS_BUILD}" python3 xcode/generate.py | tee -a "$CM_ENV"
        xcodegen generate --spec xcode/project.yml

workflows:
  build:
    name: Build BreakBoss (compile + self-test)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - *github_env

      - name: Check the release helpers without contacting Apple
        script: python3 .github/scripts/test_release.py

      - name: Build the universal Swift Playgrounds package (Release, unsigned)
        working_directory: BreakBoss.swiftpm
        script: |
          xcodebuild \
            -scheme BreakBoss \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/dd-release" \
            CODE_SIGNING_ALLOWED=NO \
            build > "$RUNNER_TEMP/build-release.log" 2>&1 || true
          python3 "$CM_BUILD_DIR/.github/scripts/annotate.py" "$RUNNER_TEMP/build-release.log" "Universal Release build"
          if ! grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/build-release.log"; then tail -30 "$RUNNER_TEMP/build-release.log"; exit 1; fi

      - *xcodegen

      - name: Build BreakBoss + AUv3 from the Xcode project (Release, unsigned)
        script: |
          xcodebuild \
            -project xcode/BreakBoss.xcodeproj \
            -scheme BreakBoss \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/dd-xcode" \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
            CODE_SIGNING_ALLOWED=NO \
            build > "$RUNNER_TEMP/build-xcode.log" 2>&1 || true
          python3 .github/scripts/annotate.py "$RUNNER_TEMP/build-xcode.log" "Xcode build (app + AUv3)"
          if ! grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/build-xcode.log"; then tail -30 "$RUNNER_TEMP/build-xcode.log"; exit 1; fi
          APP=$(find "$RUNNER_TEMP/dd-xcode/Build/Products" -maxdepth 2 -name "BreakBoss.app" | head -1)
          if [ ! -d "$APP/PlugIns/BreakBossAU.appex" ]; then echo "::error title=AUv3::BreakBossAU.appex is not inside the app"; exit 1; fi
          for f in Assets.car KnockLayout.json; do
            [ -e "$APP/PlugIns/BreakBossAU.appex/$f" ] || { echo "::error title=AUv3::$f is missing from the plug-in"; exit 1; }
          done
          python3 .github/scripts/simulate.py --verify-bundle "$APP"

      - name: Build for the iPad simulator (optimized Release)
        script: |
          xcodebuild \
            -project xcode/BreakBoss.xcodeproj \
            -scheme BreakBoss \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/dd-sim" \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            build > "$RUNNER_TEMP/build-sim.log" 2>&1 || true
          python3 .github/scripts/annotate.py "$RUNNER_TEMP/build-sim.log" "Simulator build"
          if ! grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/build-sim.log"; then tail -30 "$RUNNER_TEMP/build-sim.log"; exit 1; fi

      - name: Run the self-test and draw the faceplates on iPad
        script: |
          python3 .github/scripts/simulate.py \
            --products "$RUNNER_TEMP/dd-sim/Build/Products" \
            --output "$RUNNER_TEMP" --timeout 240

    artifacts:
      - $HOME/breakboss-tmp/shots/*.png
      - $HOME/breakboss-tmp/*.log
      - $HOME/breakboss-tmp/crash-reports/*.ips

  testflight:
    name: Upload BreakBoss to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: BreakBoss
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: com.tabdanger.BreakBoss
    scripts:
      - *github_env

      - name: Check the API key
        script: |
          ASC_KEY_ID=$(printf '%s' "${ASC_KEY_ID:-$APP_STORE_CONNECT_KEY_IDENTIFIER}" | tr -d '[:space:]')
          ASC_ISSUER_ID=$(printf '%s' "${ASC_ISSUER_ID:-$APP_STORE_CONNECT_ISSUER_ID}" | tr -d '[:space:]')
          KEY="${ASC_KEY_P8:-$APP_STORE_CONNECT_PRIVATE_KEY}"
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$KEY" ]; then
            echo "::error title=API key::Add the App Store Connect key in Codemagic: settings › Integrations › Developer Portal, named BreakBoss."
            exit 1
          fi
          mkdir -p "$SIGNING" ~/.appstoreconnect/private_keys
          KEY="$KEY" python3 -I .github/scripts/p8key.py > "$SIGNING/AuthKey.p8" || true
          cp "$SIGNING/AuthKey.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$SIGNING/AuthKey.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          if ! openssl pkey -in "$SIGNING/AuthKey.p8" -noout 2>/dev/null; then
            echo "::error title=API key::The .p8 isn't a readable private key ($(KEY="$KEY" python3 -I .github/scripts/p8key.py 2>&1 >/dev/null)). Upload the AuthKey_XXXXXXXXXX.p8 file again, exactly as downloaded."
            exit 1
          fi
          {
            echo "ASC_KEY_ID=$ASC_KEY_ID"
            echo "ASC_ISSUER_ID=$ASC_ISSUER_ID"
            echo "ASC_KEY_PATH=$SIGNING/AuthKey.p8"
          } >> "$CM_ENV"

      - name: Check App Store Connect (API key, app record, signing access)
        script: python3 .github/scripts/asc.py check

      - name: Set the build number
        working_directory: BreakBoss.swiftpm
        script: |
          BASE=$(sed -n 's/.*bundleVersion: "\([0-9][0-9]*\)".*/\1/p' Package.swift)
          VERSION=$(sed -n 's/.*displayVersion: "\([^"]*\)".*/\1/p' Package.swift)
          case "$BREAKBOSS_BUILD" in
            *[!0-9]*) echo "::error title=Build number::BREAKBOSS_BUILD must be digits only"; exit 1 ;;
          esac
          # Never below 121 (TestFlight was at 120 when builds moved here); always above every upload.
          BUILD=$(python3 "$CM_BUILD_DIR/.github/scripts/asc.py" next-build 121 "$BREAKBOSS_BUILD") || exit 1
          sed -i '' "s/bundleVersion: \"$BASE\"/bundleVersion: \"$BUILD\"/" Package.swift
          grep -n 'bundleVersion\|displayVersion' Package.swift
          echo "BUILD=$BUILD" >> "$CM_ENV"
          echo "VERSION=$VERSION" >> "$CM_ENV"
          echo "::notice title=Version::BreakBoss $VERSION (build $BUILD)"

      - name: Keep the .swiftpm zip for the records
        script: |
          mkdir -p "$RUNNER_TEMP/swiftpm"
          zip -qry "$RUNNER_TEMP/swiftpm/BreaKing-build-$BUILD.swiftpm.zip" BreakBoss.swiftpm -x '*/.build/*' '*/.swiftpm/*' '*.DS_Store'
          ls -la "$RUNNER_TEMP/swiftpm"

      - *xcodegen

      - name: Build BreakBoss + AUv3 for the App Store (archive, signed in the next steps)
        script: |
          xcodebuild \
            -project xcode/BreakBoss.xcodeproj \
            -scheme BreakBoss \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/BreakBoss.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            archive > "$RUNNER_TEMP/archive.log" 2>&1 || true
          python3 .github/scripts/annotate.py "$RUNNER_TEMP/archive.log" "Archive"
          if ! grep -q "ARCHIVE SUCCEEDED" "$RUNNER_TEMP/archive.log"; then tail -30 "$RUNNER_TEMP/archive.log"; exit 1; fi
          APP=$(find "$RUNNER_TEMP/BreakBoss.xcarchive/Products" -maxdepth 3 -name "*.app" | head -1)
          if [ -z "$APP" ]; then echo "::error title=Archive::No .app inside the archive"; exit 1; fi
          echo "APP=$APP" >> "$CM_ENV"
          /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" -c "Print CFBundleShortVersionString" -c "Print CFBundleVersion" "$APP/Info.plist"

      - name: Sign BreakBoss with Apple's cloud signing (Xcode export)
        script: |
          if [ -z "$APPLE_TEAM_ID" ]; then echo "::warning title=Team ID::Not found, so cloud signing is skipped."; exit 0; fi
          cat > "$SIGNING/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/BreakBoss.xcarchive" \
            -exportOptionsPlist "$SIGNING/ExportOptions.plist" \
            -exportPath "$SIGNING/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" > "$RUNNER_TEMP/export.log" 2>&1 || true
          IPA_FILE=$(find "$SIGNING/export" -maxdepth 1 -name "*.ipa" 2>/dev/null | head -1)
          if [ -n "$IPA_FILE" ]; then
            echo "IPA=$IPA_FILE" >> "$CM_ENV"
            echo "::notice title=Signed::BreakBoss $VERSION (build $BUILD) signed by Xcode with Apple's cloud signing ($(du -h "$IPA_FILE" | cut -f1))."
          else
            tail -25 "$RUNNER_TEMP/export.log"
            echo "::warning title=Cloud signing::Didn't work, so an API-made certificate is used instead."
          fi

      - name: Sign with an API-made certificate if cloud signing didn't work
        script: |
          if [ -n "$IPA" ]; then echo "Already signed."; exit 0; fi
          set -e
          python3 .github/scripts/asc.py prepare "$SIGNING"
          cd "$SIGNING"
          /usr/bin/openssl x509 -inform DER -in signing.cer -out signing.pem
          P12_PASSWORD=$(uuidgen)
          /usr/bin/openssl pkcs12 -export -inkey signing.key -in signing.pem -out signing.p12 -passout pass:"$P12_PASSWORD"
          KC="$SIGNING/upload.keychain-db"
          KC_PASSWORD=$(uuidgen)
          echo "KC=$KC" >> "$CM_ENV"
          security create-keychain -p "$KC_PASSWORD" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASSWORD" "$KC"
          security import signing.p12 -k "$KC" -P "$P12_PASSWORD" -A -t cert -f pkcs12
          if curl -sfL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o wwdr.cer; then security import wwdr.cer -k "$KC" || true; fi
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASSWORD" "$KC" > /dev/null
          IDENTITY=$(/usr/bin/openssl x509 -in signing.pem -noout -fingerprint -sha1 | sed 's/.*=//; s/://g')
          security find-identity -v -p codesigning "$KC"

          security cms -D -i profile.mobileprovision > profile.plist
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' profile.plist > entitlements.plist

          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          APPDIR="Payload/$(basename "$APP")"
          cp profile.mobileprovision "$APPDIR/embedded.mobileprovision"
          find "$APPDIR" -depth \( -name "*.framework" -o -name "*.dylib" \) -print0 | while IFS= read -r -d '' item; do
            codesign --force --sign "$IDENTITY" --keychain "$KC" --timestamp=none "$item"
          done
          APPEX="$APPDIR/PlugIns/BreakBossAU.appex"
          if [ -d "$APPEX" ]; then
            security cms -D -i plugin.mobileprovision > plugin-profile.plist
            /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' plugin-profile.plist > plugin-entitlements.plist
            cp plugin.mobileprovision "$APPEX/embedded.mobileprovision"
            codesign --force --sign "$IDENTITY" --keychain "$KC" --entitlements plugin-entitlements.plist \
              --generate-entitlement-der --timestamp=none "$APPEX"
          fi
          codesign --force --sign "$IDENTITY" --keychain "$KC" --entitlements entitlements.plist \
            --generate-entitlement-der --timestamp=none "$APPDIR"
          codesign --verify --deep --strict --verbose=2 "$APPDIR"
          rm -f BreakBoss.ipa
          zip -qry BreakBoss.ipa Payload
          echo "IPA=$SIGNING/BreakBoss.ipa" >> "$CM_ENV"
          echo "::notice title=Signed::BreakBoss $VERSION (build $BUILD) signed with an API-made certificate."

      - name: Check the plug-in is inside the signed app
        script: |
          if ! unzip -l "$IPA" | grep -q 'PlugIns/BreakBossAU.appex/BreakBossAU$'; then
            echo "::error title=AUv3::PlugIns/BreakBossAU.appex is missing from the signed app."
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/ipa" && mkdir -p "$RUNNER_TEMP/ipa" && unzip -q "$IPA" -d "$RUNNER_TEMP/ipa"
          APPEX=$(find "$RUNNER_TEMP/ipa/Payload" -maxdepth 3 -name "BreakBossAU.appex" | head -1)
          if [ ! -f "$APPEX/embedded.mobileprovision" ] || ! codesign --verify --strict "$APPEX"; then
            echo "::error title=AUv3::The plug-in inside the app isn't signed with its own App Store profile."
            exit 1
          fi
          echo "::notice title=AUv3::The BreakBoss plug-in is inside the signed app with its own App Store profile."

      - name: Upload to App Store Connect
        script: |
          cd "$SIGNING"
          xcrun altool --validate-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" > validate.log 2>&1 || { cat validate.log; exit 1; }
          cat validate.log
          STATUS=0
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" > upload.log 2>&1 || STATUS=$?
          cat upload.log
          if [ "$STATUS" -ne 0 ] || grep -qiE "^\*\*\* error|upload failed" upload.log; then exit 1; fi
          echo "::notice title=Uploaded::BreakBoss $VERSION (build $BUILD) was uploaded."

      - name: Wait for Apple to process the build, then give it to the internal testers
        script: python3 .github/scripts/asc.py wait "$BUILD"

      - name: Send the build to the external group (Beta App Review for the public link)
        script: python3 .github/scripts/asc.py external "$BUILD" || echo "::warning title=External::Not sent to the external group; the upload itself worked."
        ignore_failure: true

      - name: Clean up
        script: |
          if [ -n "$KC" ]; then security delete-keychain "$KC" || true; fi
          rm -rf "$SIGNING" ~/.appstoreconnect/private_keys

    artifacts:
      - $HOME/breakboss-tmp/swiftpm/*.zip
      - $HOME/breakboss-tmp/archive.log
      - $HOME/breakboss-tmp/export.log
